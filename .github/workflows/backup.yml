name: Daily data backup

on:
  schedule:
    # Daily 06:15 UTC. GitHub may delay scheduled runs by a few minutes.
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kickoff-backup
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install test dependency
        run: npm ci --no-audit --no-fund

      - name: Export production data (public read)
        run: node tools/export-backup.js --env=prod --out=backup.json

      - name: Validate the backup can be restored
        run: node tools/validate-backup.js backup.json

      - name: Restore the backup into in-memory Postgres
        run: node tools/restore-drill.js backup.json

      - name: Summarise backup
        run: |
          node -e "
            const data = require('./backup.json');
            const counts = {
              seasons: data.seasons.length,
              teams: data.teams.length,
              players: data.players.length,
              matches: data.matches.length,
              events: data.matchEvents.length
            };
            console.log(counts);
            const chain = data.auditChainHead;
            const lines = [
              '### KickOff Division backup',
              '',
              ...Object.entries(counts).map(([k, v]) => '- ' + k + ': ' + v)
            ];
            if (chain) {
              lines.push(
                '',
                '### Audit chain head',
                '',
                '- rows: ' + chain.count,
                '- last id: ' + chain.lastId,
                '- at: ' + chain.at,
                '- head: ' + chain.head
              );
            } else {
              lines.push('', 'Audit chain head: not available (roadmap D migration pending).');
            }
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          "

      - name: Encrypt the backup
        env:
          KICKOFF_BACKUP_PASSPHRASE: ${{ secrets.KICKOFF_BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$KICKOFF_BACKUP_PASSPHRASE" ]; then
            echo "::error::The KICKOFF_BACKUP_PASSPHRASE repository secret is not set. Add it (a long random passphrase kept in a password manager) and re-run; this job refuses to upload an unencrypted backup."
            exit 1
          fi
          node tools/backup-crypt.js encrypt backup.json backup.kob

      - name: Check the encrypted backup decrypts
        env:
          KICKOFF_BACKUP_PASSPHRASE: ${{ secrets.KICKOFF_BACKUP_PASSPHRASE }}
        run: |
          node tools/backup-crypt.js decrypt backup.kob backup-check.json
          cmp backup.json backup-check.json
          rm -f backup-check.json

      - name: Remove the plaintext backup
        run: rm -f backup.json

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: kickoff-backup-${{ github.run_number }}
          path: backup.kob
          retention-days: 90
          if-no-files-found: error
