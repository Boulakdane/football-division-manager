name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check for committed secrets
        run: node tools/check-secrets.js

      - name: Install CSS tooling
        run: npm ci --no-audit --no-fund

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Check compiled CSS is current
        run: git diff --exit-code -- css/tailwind.css

      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in js/*.js js/domain/*.js tools/*.js; do
            node --check "$file"
          done

      - name: Test SQL integrity and RLS
        run: npm run test:sql

      - name: Test anonymous grants are read-only
        run: npm run test:grants

      - name: Test add_players (squad import backend)
        run: npm run test:add-players

      - name: Test derived player and team totals (roadmap A)
        run: npm run test:derived-stats

      - name: Test dropping the stored player totals (roadmap A stage 3)
        run: npm run test:drop-totals

      - name: Test domain helpers and standings without a browser (roadmap E)
        run: npm run test:domain

      - name: Compare JS and SQL standings (roadmap E dual-run)
        run: npm run test:standings-dual

      - name: Test the scorer role and live match entry (roadmap B)
        run: npm run test:scorer-role

      - name: Test the two divisions (roadmap K)
        run: npm run test:divisions

      - name: Test Arabic names, licence numbers and birth dates (task L)
        run: npm run test:profile-fields

      - name: Test squad import parser (xlsx/csv)
        run: npm run test:squad-import

      - name: Test the security drift monitor (offline mock)
        run: npm run test:drift

      - name: Test CSV round trip
        shell: bash
        run: |
          node tools/csv-to-backup.js data/examples /tmp/kickoff-first.json
          node tools/backup-to-csv.js /tmp/kickoff-first.json /tmp/kickoff-csv
          node tools/csv-to-backup.js /tmp/kickoff-csv /tmp/kickoff-second.json
          node -e "
            const fs = require('fs');
            const a = JSON.parse(fs.readFileSync('/tmp/kickoff-first.json', 'utf8'));
            const b = JSON.parse(fs.readFileSync('/tmp/kickoff-second.json', 'utf8'));
            const canon = value => {
              if (Array.isArray(value)) return value.map(canon);
              if (value && typeof value === 'object') {
                const out = {};
                for (const key of Object.keys(value).sort()) out[key] = canon(value[key]);
                return out;
              }
              return value;
            };
            if (JSON.stringify(canon(a)) !== JSON.stringify(canon(b))) {
              console.error('CSV round trip changed the data.');
              process.exit(1);
            }
            console.log('CSV round trip is stable.');
          "

      - name: Validate backup structure and references
        run: node tools/validate-backup.js /tmp/kickoff-first.json

      - name: Restore drill into in-memory Postgres
        run: node tools/restore-drill.js /tmp/kickoff-first.json
